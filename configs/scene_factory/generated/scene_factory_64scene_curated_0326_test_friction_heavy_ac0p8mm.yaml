# scene_factory_64scene_curated_0326_test_friction_heavy_ac0p8mm.yaml
# All 64 held-out test scenes forced to uniform HEAVY weather: AC road + 0.8mm water film.
# mu_static ~= 0.804 (vs 1.105 for dry AC) — ~27% friction reduction.
# This is a heavier rain condition, more slippery than AC 0.5mm but still below hydroplaning floor
# (AC hits floor at 0.9mm). Compare with moderate (AC 0.5mm, mu=0.859) and hard (SMA 2mm, mu~1e-3).

io:
  scene_json_dir: data/processed/waymo_scenes_json
world:
  root_container: /World/SceneFactoryWorlds
  world_count: 64
  grid_cols: 8
  rows: 8
  world_size_m:
  - 200.0
  - 200.0
  padding_m: 200.0
  base_z_m: 0.0
  bounds_size_m: 200.0
  origin_mode: center
  origin_center_mode: mean
  assignments:
  - scene_json: scene_000090.json
    friction:
      road_type: AC
      precip_type: rain
      precip_intensity_mmph: 16.0
      water_film_mm: 0.8
