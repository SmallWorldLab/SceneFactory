# scene_factory_64scene_curated_0326_test_friction_hard_sma2mm.yaml
# All 64 held-out test scenes forced to uniform HARD weather: SMA road + 2.0mm water film.
# μ_static ≈ 0.55 (vs 1.10 for dry AC), μ_dynamic ≈ 0.55.
#
# Rationale: random friction assignment (scene_factory_64scene_curated_0326_test_friction.yaml)
# conflates geometry difficulty with friction difficulty — easy straight-road scenes that draw
# dry AC inflate the SR numerator. This uniform-hard config controls for that: every scene
# sees the same surface condition, so the only variable between v7 and v8 is the policy's
# friction awareness, not which scenes happened to draw wet weather.
#
# SMA + 2.0mm is within v7's training distribution (10% of training scenes) but is
# challenging enough to discriminate between friction-aware and friction-naive policies.
# It is NOT so extreme (e.g., OGFC 4mm) that both models collapse simultaneously.
io:
  scene_json_dir: /home/yz8733/Github/isaac-rl/data/processed/waymo_scenes_json
world:
  root_container: /World/SceneFactoryWorlds
  world_count: 64
  grid_cols: 8
  rows: 8
  world_size_m:
  - 200.0
  - 200.0
  padding_m: 200.0
  base_z_m: 0.0
  bounds_size_m: 200.0
  origin_mode: center
  origin_center_mode: mean
  assignments:
  - scene_json: scene_000090.json
    friction:
      road_type: SMA
      precip_type: rain
      precip_intensity_mmph: 5.0
      water_film_mm: 2.0
