# Weather-exposure ablation, arm B: EVEN 0.0-12.0 mm.
# Generated by scripts/make_weather_ablation_pools.py -- do not hand-edit.
# Derived from scene_factory_256scene_random_0414_train_friction.yaml.
#
# water_film_mm spread evenly over [0.0, 12.0] mm across the 256 worlds,
# then shuffled with seed 42 so depth is uncorrelated with scene index.
# Built on the CORRECTED TRFC model.  Every world has a usable, non-zero mu,
# and the span now reaches the region where friction binds on this vehicle.
#
# Matched to its sibling pool on scene assignment, world order, and
# per-scene road_type.  water_film_mm is the ONLY field that differs.
# Water film spans 0-12.0 mm.  The old 0.8 mm ceiling existed only to
# dodge the TRFC Eq.(12) mu=0 cliff; that was a dimensional bug and is FIXED
# (tasks/fix_trfc_yr_hydroplaning_cliff.md), so the wide span is now valid and
# is required to reach the regime where friction actually binds.
