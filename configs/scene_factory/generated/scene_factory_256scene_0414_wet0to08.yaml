# Weather-exposure ablation, arm B: EVEN 0.0-0.8 mm.
# Generated by scripts/make_weather_ablation_pools.py -- do not hand-edit.
# Derived from scene_factory_256scene_random_0414_train_friction.yaml.
#
# water_film_mm spread evenly over [0.0, 0.8] mm across the 256 worlds,
# then shuffled with seed 42 so depth is uncorrelated with scene index.
# Unlike the pool model E trained on, every world here has a usable mu:
# no world sits past the 0.85 mm cliff.
#
# Matched to its sibling pool on scene assignment, world order, and
# per-scene road_type.  water_film_mm is the ONLY field that differs.
# Water film stays <= 0.8 mm so no world lands past the TRFC mu=0
# cliff at 0.85 mm (tasks/fix_trfc_yr_hydroplaning_cliff.md).
