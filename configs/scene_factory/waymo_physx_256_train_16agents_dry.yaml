# SceneFactory retrain — DRY-ONLY, 256 worlds x 16 agents, fixed-physics stack.
#
# Reproduces the paper's main multi-scene PPO policy (v7 lineage) on the current
# code base, with the weather axis removed and the ground geometry corrected.
#
# Differences vs waymo_physx_256_train_16agents.yaml (the v7 recipe):
#
#   1. Scene pool -> scene_factory_256scene_random_0414_train.yaml
#      All 256 worlds are AC / clear / 0.0 mm water film (mu ~= 1.105 from TRFC,
#      clipped to 1.0 by the wheel-side "min" friction combine).  The friction
#      pool used by v7/v8 put 73 of 256 worlds (28.5%) at mu = 0.0 exactly --
#      AC@1.0mm, SMA@2.0mm and OGFC@4.0mm all fall off the TRFC cliff -- so those
#      worlds trained on a frictionless surface.  Same 256 scene JSONs, same
#      order; only the per-world friction block differs.
#
#   2. ground_mode: cuboid (was "plane").  The multi-agent env has spawned a
#      per-env 1000x1000x1 m kinematic cuboid since af94c95 regardless of this
#      field (it calls _spawn_ground(..., mode="cuboid") unconditionally), so
#      "plane" in the v7 config was already a dead value.  Stated explicitly here
#      so the config matches what the simulator actually builds.
#
#   3. env_spacing: 400 -> 1500 m.  At 400 m the per-env 1000 m ground cuboids
#      OVERLAP (each spans +/-500 m from its env origin), so neighbouring worlds
#      shared ground geometry.  1500 m clears them with 500 m of margin.
#      Note this does NOT make envs numerically independent -- all envs still
#      share one PhysX solver scene and cross-env collision filtering is gated to
#      CPU (tasks/fix_gpu_env_isolation.md).  It only removes the geometric overlap.
#
#   4. run_name -> dry_16agents_1500spacing.
#
# Physics fixes now in force that were NOT present for v7/v8:
#   - ground contact_offset=0.10 / rest_offset=0.0 (6fa7d7f) -- stops multi-agent
#     wheels tunnelling through the ground and losing all traction.
#   - suspension 2 MN/m @ 49 kN.s/m, velocity-tracking wheel drive (7d33f1b).
#   - per-env ground-material friction instead of the wheel-material min trick
#     (f783b4f), with read-back verification at startup.
#   - metric snapshot before reset-zeroing (f783b4f).
#
# weather_context_enable stays true: the 4-D weather token is now a constant
# (dry-AC) for every world, but keeping it preserves the observation dimensions
# and network shape of v7/v8 so the checkpoints stay architecturally comparable.
#
# To train:
#   bash run_waymo_physx_train_16agents_dry.sh
#
# Logs: logs/rsl_rl/waymo_physx_256/dry_16agents_1500spacing/

env:
  num_envs: 256
  num_agents_per_env: 16
  observation_mode: "choco_reference"
  env_spacing: 1500.0
  spawn_height_m: 1.2
  spawn_yaw_noise_rad: 0.0
  ground_mode: "cuboid"
  use_scene_factory_roads: true
  reset_mode: "teleport_only"
  start_radius_m: 0.0
  agent_spawn_circle_radius_m: 0.0
  agent_spawn_jitter_m: 0.0
  episode_length_s: 45.0
  goal_radius_min_m: 5.0
  goal_radius_max_m: 30.0
  goal_reached_threshold_m: 3.0
  fall_height_threshold_m: 0.0
  bad_tilt_gravity_threshold: -0.15
  max_distance_from_origin_m: 100.0
  agent_neighbor_obs_scale_m: 100.0
  agent_collision_warmup_steps: 24
  replicate_physics: false
  clone_in_fabric: "false"

scene_factory:
  config_path: "configs/scene_factory/generated/scene_factory_256scene_random_0414_train.yaml"
  world_index: 0
  world_selection_mode: "random_envs"
  random_world_seed: 42

observation:
  weather_context_enable: true
  road_points_enable: true
  road_points_k: 250
  road_points_radius_m: 15.0
  road_points_type_norm: 20.0
  road_points_mode: "road_running"
  road_points_include_dirs: true
  neighbor_enable: true
  neighbor_k: 8
  neighbor_include_ttc: true
  neighbor_include_index: false
  neighbor_ttc_max_s: 10.0
  timing_print_enable: false
  timing_print_every_n: 32

timing:
  step_log_enable: true
  step_print_enable: false
  step_print_every_n: 128
  step_cuda_sync_enable: false

reward:
  mode: "choco_baseline"
  goal_bonus: 60.0
  lane_center_enable: false
  lane_forbidden_enable: true
  lane_forbidden_penalty: -20.0
  collision_penalty: -6.0
  crash_penalty: -10.0
  choco_offroad_penalty: -0.5
  choco_idle_penalty_enable: true
  choco_idle_penalty_per_step: 0.06
  choco_idle_speed_threshold_mps: 2.5
  choco_geom_lane_enable: true
  choco_geom_lane_per_step: 0.08
  choco_geom_lane_tolerance_m: 1.75
  choco_geom_lane_heading_weight: 0.8
  choco_geom_lane_min_alignment: 0.35
  choco_geom_route_progress_weight: 4.0
  choco_geom_offroad_enable: true
  choco_geom_offroad_lateral_threshold_m: 3.25
  choco_geom_offroad_distance_threshold_m: 6.0
  choco_ttc_penalty_enable: true
  choco_ttc_penalty_alpha: 0.10
  choco_ttc_penalty_max: 0.35
  choco_ttc_penalty_min_ttc: 0.5
  choco_road_edge_ttc_penalty_enable: true
  choco_road_edge_ttc_penalty_alpha: 0.07
  choco_road_edge_ttc_penalty_max: 0.40
  choco_road_edge_ttc_penalty_min_ttc: 0.5
  choco_road_edge_ttc_hard_min_ttc: 0.5
  choco_road_edge_ttc_radius_m: 40.0

policy:
  type: "late_fusion"
  ego_layers: [64, 64]
  road_layers: [96, 96]
  vehicle_layers: [96, 96]
  shared_layers: [128, 64]
  last_layer_dim_pi: 64
  last_layer_dim_vf: 64
  activation: "relu"
  dropout: 0.0
  pool: "max"

assets:
  student_usd: "artifacts/student_vehicle_assets/vehicle_student/student_fwd_vehicle.usd"
  tunable_config_json: "artifacts/student_vehicle_sysid/comprehensive_fwd_v1_cem_v4/best_config.json"

runner:
  log_dir: "logs/rsl_rl"
  seed: 42
  experiment_name: "waymo_physx_256"
  run_name: "dry_16agents_1500spacing"
  shared_policy_mode: "agent_slots"
  max_iterations: 3000
  num_steps_per_env: 64
  save_interval: 50
  num_learning_epochs: 5
  num_mini_batches: 4
  noise_std_type: "log"
  entropy_coef: 1.0e-5
  learning_rate: 1.0e-4
  clip_param: 0.15
  desired_kl: 0.01
  gamma: 0.99
  gae_lambda: 0.98
  value_loss_coef: 1.0

app:
  device: "cuda:0"
  rl_device: "cuda:0"
