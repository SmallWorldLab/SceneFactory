# workzone_scenes.yaml
# Scene manifest for workzone policy fine-tuning.
#
# 256 synthetic workzone scenes (straight-road, randomized taper designs).
# At startup, 32 of the 256 are sampled via random_fill with seed 2024.
#
# Regenerate scenes with:
#   python -m src.workzone_scene_generator --num_worlds 256 --seed 42

io:
  scene_json_dir: data/processed/workzone_scenes_json

road:
  # Workzone polylines have ~6.9 m point spacing; default jump_break_m=3.0 filters every segment.
  jump_break_m: 10.0

world:
  root_container: /World/SceneFactoryWorlds
  world_count: 32
  grid_cols: 8
  rows: 4
  world_size_m: [300.0, 100.0]
  padding_m: 200.0
  base_z_m: 0.0
  bounds_size_m: 300.0
  origin_mode: center
  origin_center_mode: mean
  assignment_fill_mode: random_fill
  assignment_fill_seed: 2024
  assignments:
  - {scene_json: scene_workzone_000.json}
  - {scene_json: scene_workzone_001.json}
  - {scene_json: scene_workzone_002.json}
