# brake_friction_sweep.yaml
# Braking friction sweep at a CONSISTENT injected entry speed (~6 m/s).
# mu = 1.0 -> 0.0 in 0.1 steps (11 worlds, one mu each). No Waymo data required.
#
# Entry speed is injected (root velocity + wheel pre-spin), so every world starts
# at the same v0 -- required because at low/zero mu the car cannot accelerate by
# throttle. Full brake to a stop; mu=0 never stops (censored at the brake cap).
#
# Launch: bash run_brake_friction_sweep.sh

env:
  num_envs: 12
  num_agents_per_env: 1
  observation_mode: "choco_reference"
  # Ground runway: ±800 m so even mu=0.1 at 100 km/h (~430 m stop) stays on-ground.
  # Default 1000 elsewhere; only this high-speed test enlarges it.
  ground_cuboid_size_m: 1600.0
  env_spacing: 1800.0                     # > 1600 m ground -> grounds do not overlap
  spawn_height_m: 1.2
  spawn_yaw_noise_rad: 0.0                # forward = world +x (injection direction)
  ground_mode: "cuboid"
  dynamics_mode: "physx"
  use_scene_factory_roads: false
  episode_length_s: 600.0
  goal_radius_min_m: 8000.0
  goal_radius_max_m: 9000.0
  max_distance_from_origin_m: 8000.0
  agent_spawn_circle_radius_m: 0.0
  agent_spawn_jitter_m: 0.0
  start_radius_m: 0.0
  fall_height_threshold_m: -5.0
  bad_tilt_gravity_threshold: -0.97
  replicate_physics: false
  agent_collision_warmup_steps: 0
  # mu 1.0 -> 0.1 plus the two NHTSA (VRTC 1999) asphalt surfaces: dry mu=0.86,
  # wet mu=0.66, so the sim compares directly (not by interpolation) against their
  # 100 km/h measured stopping distances. friction_ruler sets static=mu, dynamic=0.8*mu.
  friction_ruler_mu_values: "1.0,0.9,0.86,0.8,0.7,0.66,0.6,0.5,0.4,0.3,0.2,0.1"
  # Clamp only maps throttle->wheel target; here v0 is injected so it is unused for
  # acceleration, but kept consistent with the other brake tests.
  bicycle_max_speed_mps: 19.5

observation:
  weather_context_enable: false
  road_points_enable: false
  road_points_k: 0
  neighbor_enable: false
  neighbor_k: 0
  neighbor_include_ttc: false
  neighbor_include_index: false

timing:
  step_log_enable: false
  step_print_enable: false
  step_print_every_n: 999
  step_cuda_sync_enable: false

reward:
  mode: "choco_baseline"
  goal_bonus: 0.0
  lane_center_enable: false
  lane_forbidden_enable: false
  collision_penalty: 0.0
  crash_penalty: 0.0
  choco_offroad_penalty: 0.0
  choco_idle_penalty_enable: false
  choco_geom_lane_enable: false
  choco_geom_offroad_enable: false
  choco_ttc_penalty_enable: false
  choco_road_edge_ttc_penalty_enable: false

policy:
  type: "late_fusion"
  ego_layers: [32]
  road_layers: [32]
  vehicle_layers: [32]
  shared_layers: [32]
  last_layer_dim_pi: 32
  last_layer_dim_vf: 32
  activation: "relu"
  dropout: 0.0
  pool: "max"

assets:
  student_usd: "artifacts/student_vehicle_assets/vehicle_student/student_fwd_vehicle.usd"
  tunable_config_json: "artifacts/student_vehicle_sysid/comprehensive_fwd_v1_cem_v4/best_config.json"

scene_factory:
  config_path: "configs/scene_factory/workzone_demo.yaml"
  world_index: 0
  world_selection_mode: "sequential"
  random_world_seed: 42

runner:
  log_dir: "logs/rsl_rl"
  seed: 42
  experiment_name: "brake_friction_sweep"
  run_name: "physx_mu_sweep"
  shared_policy_mode: "agent_slots"
  max_iterations: 1
  num_steps_per_env: 64
  save_interval: 9999
  learning_rate: 3.0e-4
  num_learning_epochs: 1
  num_mini_batches: 1
  entropy_coef: 0.0
  clip_param: 0.2
  desired_kl: 0.01
  gamma: 0.99
  gae_lambda: 0.95
  value_loss_coef: 1.0

app:
  device: "cuda:0"
  rl_device: "cuda:0"
